# Startet das Gesamtsystem aus den publizierten Images der GitHub Container Registry.
# Dient als Test-/Abnahmeumgebung und als Grundlage fuer das Deployment in P4.
#
# Aufruf (aus Code/Ticket_System):
#   IMAGE_TAG=1.0.0 docker compose -f docker-compose.release.yml up -d
#
# Ohne IMAGE_TAG wird "latest" verwendet. Fuer reproduzierbare Deployments
# immer einen festen Tag (SemVer oder sha-<commit>) angeben.
name: ticket-system-release

services:
  postgres:
    image: postgres:16-alpine
    # Bei einem Absturz startet Docker den Container automatisch neu (Self-Healing)
    restart: unless-stopped
    # Ressourcenlimits verhindern, dass ein Container den ganzen Host blockiert
    mem_limit: 512m
    cpus: 1.0
    environment:
      POSTGRES_USER: ticket_user
      POSTGRES_PASSWORD: ticket_password
    volumes:
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP-Port ist erst nach dem Init-Skript offen
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "ticket_user"]
      interval: 2s
      timeout: 3s
      retries: 30

  employee-service:
    image: ${IMAGE_REGISTRY:-ghcr.io/yaracorder0/m324_gruppe4}/employee-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/employee_db
    ports:
      # Port ist konfigurierbar, damit Blue und Green parallel laufen koennen
      - "${EMPLOYEE_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 25
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

  ticket-service:
    image: ${IMAGE_REGISTRY:-ghcr.io/yaracorder0/m324_gruppe4}/ticket-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ticket_db
      EMPLOYEE_SERVICE_URL: http://employee-service:8081/api/employees
    ports:
      - "${TICKET_PORT:-8082}:8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 25
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      employee-service:
        condition: service_healthy
