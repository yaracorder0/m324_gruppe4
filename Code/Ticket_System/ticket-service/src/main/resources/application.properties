spring.application.name=ticket-service

server.port=8082
spring.datasource.url=jdbc:postgresql://localhost:5433/ticket_db
spring.datasource.username=ticket_user
spring.datasource.password=ticket_password
spring.jpa.hibernate.ddl-auto=update
employee.service.url=http://localhost:8081/api/employees

# Actuator Health Check & Monitoring (Z1 – Continuous Improvement)
# Aktiviert: health, info, metrics, loggers, httptrace fuer Kennzahlen-Erhebung
management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoint.health.show-details=always
management.endpoint.metrics.enabled=true
# Anwendungsinfo fuer /actuator/info
info.app.name=Ticket-Service
info.app.version=0.0.1-SNAPSHOT
info.app.description=Microservice zur Verwaltung von Support-Tickets