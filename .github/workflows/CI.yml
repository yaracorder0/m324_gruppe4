name: CI (V2)

# V2: ein gemeinsamer Workflow mit einem Job pro Microservice.
# Bei jeder Aenderung werden immer beide Services gebaut und getestet.
# Die Systemtests laufen danach in einem eigenen Job und verwenden die
# JARs aus den Service-Jobs weiter (kein zweiter Build).
# P3b: Sind alle Tests gruen, werden die Docker-Images gebaut und auf main
# bzw. bei Release-Tags (v*) in die GitHub Container Registry publiziert.
on:
  push:
    branches: [ "main", "feature/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      maven_cache:
        description: "Maven-Cache verwenden (fuer Laufzeitvergleich deaktivierbar)"
        type: boolean
        default: true

# Aeltere Laeufe auf demselben Branch abbrechen, wenn neu gepusht wird.
# Auf main nicht abbrechen, damit jeder gemergte Commit ein Image erhaelt.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  employee-service:
    name: Build & Test employee-service
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Code/Ticket_System

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          # Bei manuellem Start mit maven_cache=false wird ohne Cache gebaut
          cache: ${{ github.event.inputs.maven_cache != 'false' && 'maven' || '' }}

      # Stufe 1: Kompilieren, Unit-Tests (ohne DB) und JAR erstellen
      - name: Build & Unit-Tests
        run: mvn -B -ntp -pl employee-service -am package

      - name: Start PostgreSQL
        run: docker compose up -d

      # Postgres oeffnet den TCP-Port erst, nachdem das Init-Skript durchgelaufen ist
      - name: Wait for PostgreSQL
        run: |
          for _ in $(seq 1 30); do
            if docker exec ticket_system_db pg_isready -h 127.0.0.1 -U ticket_user; then
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready in time"
          docker compose logs postgres
          exit 1

      # Stufe 2: Integrationstests gegen PostgreSQL (Unit-Tests nicht nochmals ausfuehren)
      - name: Integrationstests
        run: mvn -B -ntp -pl employee-service -am verify -DskipUTs=true

      - name: Test-Zusammenfassung
        if: always()
        run: >
          python3 ci/test-summary.py "employee-service"
          "Unit-Tests=employee-service/target/surefire-reports/TEST-*.xml"
          "Integrationstests=employee-service/target/failsafe-reports/TEST-*.xml"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: employee-service-test-reports
          path: |
            Code/Ticket_System/employee-service/target/surefire-reports/
            Code/Ticket_System/employee-service/target/failsafe-reports/

      # Build-Ergebnis fuer P3b: JAR, eindeutig dem Commit zugeordnet
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: employee-service-jar-${{ github.sha }}
          path: Code/Ticket_System/employee-service/target/employee-service-*.jar
          if-no-files-found: error
          retention-days: 14

  ticket-service:
    name: Build & Test ticket-service
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Code/Ticket_System

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          # Bei manuellem Start mit maven_cache=false wird ohne Cache gebaut
          cache: ${{ github.event.inputs.maven_cache != 'false' && 'maven' || '' }}

      # Stufe 1: Kompilieren, Unit-Tests (ohne DB) und JAR erstellen
      - name: Build & Unit-Tests
        run: mvn -B -ntp -pl ticket-service -am package

      - name: Start PostgreSQL
        run: docker compose up -d

      # Postgres oeffnet den TCP-Port erst, nachdem das Init-Skript durchgelaufen ist
      - name: Wait for PostgreSQL
        run: |
          for _ in $(seq 1 30); do
            if docker exec ticket_system_db pg_isready -h 127.0.0.1 -U ticket_user; then
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready in time"
          docker compose logs postgres
          exit 1

      # Stufe 2: Integrationstests gegen PostgreSQL (employee-service wird dort gemockt)
      - name: Integrationstests
        run: mvn -B -ntp -pl ticket-service -am verify -DskipUTs=true

      - name: Test-Zusammenfassung
        if: always()
        run: >
          python3 ci/test-summary.py "ticket-service"
          "Unit-Tests=ticket-service/target/surefire-reports/TEST-*.xml"
          "Integrationstests=ticket-service/target/failsafe-reports/TEST-*.xml"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ticket-service-test-reports
          path: |
            Code/Ticket_System/ticket-service/target/surefire-reports/
            Code/Ticket_System/ticket-service/target/failsafe-reports/

      # Build-Ergebnis fuer P3b: JAR, eindeutig dem Commit zugeordnet
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ticket-service-jar-${{ github.sha }}
          path: Code/Ticket_System/ticket-service/target/ticket-service-*.jar
          if-no-files-found: error
          retention-days: 14

  # Stufe 3: Systemtests mit beiden Services, erst wenn beide Service-Jobs gruen sind
  system-tests:
    name: Systemtests (beide Services)
    needs: [ employee-service, ticket-service ]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Code/Ticket_System

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Nur Java-Runtime noetig, es wird nichts gebaut
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Die JARs aus den Service-Jobs dorthin legen, wo das Skript sie erwartet
      - name: Download employee-service JAR
        uses: actions/download-artifact@v4
        with:
          name: employee-service-jar-${{ github.sha }}
          path: Code/Ticket_System/employee-service/target

      - name: Download ticket-service JAR
        uses: actions/download-artifact@v4
        with:
          name: ticket-service-jar-${{ github.sha }}
          path: Code/Ticket_System/ticket-service/target

      - name: Start PostgreSQL
        run: docker compose up -d

      - name: Wait for PostgreSQL
        run: |
          for _ in $(seq 1 30); do
            if docker exec ticket_system_db pg_isready -h 127.0.0.1 -U ticket_user; then
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready in time"
          docker compose logs postgres
          exit 1

      - name: Systemtests ausfuehren
        run: bash system-tests/run-system-tests.sh

      - name: Test-Zusammenfassung
        if: always()
        run: python3 ci/test-summary.py "Systemtests" "Systemtests=system-tests/reports/*.xml"

      - name: Upload Systemtest-Reports und Service-Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-test-reports
          path: |
            Code/Ticket_System/system-tests/reports/
            Code/Ticket_System/system-tests/logs/

  # Stufe 4 (P3b): Docker-Image pro Service bauen und publizieren.
  # Laeuft nur, wenn alle Tests erfolgreich waren. Gepusht wird nur auf main
  # und bei Release-Tags, auf Feature-Branches und in PRs wird nur gebaut.
  publish:
    name: Publish ${{ matrix.service }}
    needs: [ system-tests ]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Least Privilege: nur dieser Job darf in die Registry schreiben
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [ employee-service, ticket-service ]
    env:
      PUBLISH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Genau das JAR verwenden, das alle Teststufen bestanden hat
      - name: Download ${{ matrix.service }} JAR
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.service }}-jar-${{ github.sha }}
          path: Code/Ticket_System/${{ matrix.service }}/target

      # Image-Namen muessen kleingeschrieben sein
      - name: Image-Namen bestimmen
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_ENV"

      # Tags: sha-<commit> immer, latest nur auf main, SemVer nur bei Release-Tags v*
      - name: Tags und Labels erzeugen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN wird von GitHub pro Lauf erzeugt, es wird kein eigenes Secret benoetigt
      - name: Login GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: Code/Ticket_System/${{ matrix.service }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Keine zusaetzlichen Attestation-Manifeste, damit die Registry nur die Images zeigt
          provenance: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Pipeline-Ausgabe: welches Artefakt wurde publiziert?
      - name: Publiziertes Artefakt ausgeben
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Artefakt: ${{ matrix.service }}"
            echo ""
            if [ "$PUBLISH" = "true" ]; then
              echo "**Status:** publiziert in die GitHub Container Registry"
            else
              echo "**Status:** nur gebaut, nicht publiziert (kein Push auf main oder Release-Tag)"
            fi
            echo ""
            echo "| Eigenschaft | Wert |"
            echo "|---|---|"
            echo "| Image | \`${IMAGE_NAME}\` |"
            echo "| Tags | $(echo "$TAGS" | sed 's/.*://' | paste -sd ',' - | sed 's/,/, /g') |"
            echo "| Digest | \`${DIGEST}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Pipeline-Lauf | ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} |"
            if [ "$PUBLISH" = "true" ]; then
              echo ""
              echo "\`docker pull $(echo "$TAGS" | head -n 1)\`"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
 